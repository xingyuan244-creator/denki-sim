<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かんたん電気代シミュレーション｜30秒で削減額がわかる</title>
<meta name="description" content="法人・個人事業主さま向け。7つの質問に答えるだけで、電気代の削減余地の目安がわかる無料のシミュレーションです。">
<style>
/* =========================================================================
   デザイントークン
   -------------------------------------------------------------------------
   色は「役割」で分離している（心理学的な色の使い分け）:
     --trust : 信頼・安定（構造・見出し）→ 濃紺。金融/インフラ系で信頼性の想起が強い
     --cta   : 行動（CTAのみに使用）    → 橙。ページ内で唯一の高彩度＝フォン・レストルフ効果
     --money : 利得（金額のみに使用）   → 緑。増加・肯定の連想
   CTA色を他の要素に流用すると「唯一性」が壊れて効果が落ちるため、必ずCTA専用に保つこと。
   ========================================================================= */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f2f5f9;
  --border:#e0e5ec; --text:#101828; --muted:#5b6779;
  --trust:#123a6b; --trust-2:#2f6fd0; --trust-soft:#e9f0fa;
  --cta:#d9530a; --cta-fg:#ffffff; --cta-hover:#bd4607;
  --money:#0b7a52; --money-soft:#e6f5ee;
  --warn:#b4231f;
  --shadow:0 1px 2px rgba(16,32,56,.05), 0 10px 28px rgba(16,32,56,.07);
  --shadow-cta:0 4px 14px rgba(217,83,10,.28);
  --radius:14px;
  --mono:"SFMono-Regular",Consolas,"Roboto Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c1017; --surface:#151b24; --surface-2:#1b232e;
    --border:#2a3441; --text:#e8eef6; --muted:#98a5b7;
    --trust:#7fb0f0; --trust-2:#9cc4fa; --trust-soft:#152437;
    --cta:#ff8a3d; --cta-fg:#2a1403; --cta-hover:#ffa163;
    --money:#4bc48d; --money-soft:#12291f;
    --warn:#ff8b86;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
    --shadow-cta:0 4px 14px rgba(255,138,61,.22);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  line-height:1.75; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 40px}
body.has-sticky .wrap{padding-bottom:120px}
@media(min-width:720px){ body.has-sticky .wrap{padding-bottom:40px} }

header.site{display:flex;align-items:center;gap:10px;padding:2px 0 18px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--trust);display:grid;place-items:center;color:#fff;font-size:16px}
@media (prefers-color-scheme: dark){ .logo{color:#0c1017} }
header.site h1{font-size:14.5px;margin:0;font-weight:700;letter-spacing:.01em}
header.site .sub{font-size:11.5px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.4}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:26px 20px}
@media(min-width:720px){ .pad{padding:36px 40px} }

.fade{animation:fade .3s cubic-bezier(.2,.7,.3,1)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){ .fade{animation:none} }

/* ---- イントロ ---- */
.hero h2{font-size:25px;line-height:1.5;margin:0 0 14px;letter-spacing:-.01em}
@media(min-width:720px){ .hero h2{font-size:32px} }
.hero h2 em{font-style:normal;color:var(--money);font-weight:800}
.lead-p{color:var(--muted);margin:0 0 8px;font-size:15px}
/* 損失回避フレーム：「得られる」ではなく「出ていき続ける」を可視化する一文 */
.loss{
  border-left:3px solid var(--cta);background:var(--surface-2);
  padding:12px 16px;border-radius:0 10px 10px 0;font-size:14px;margin:18px 0 22px;
}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 22px;padding:0;list-style:none}
.chips li{font-size:12px;background:var(--trust-soft);color:var(--trust);padding:5px 11px;border-radius:999px;font-weight:700}
.reassure{list-style:none;margin:18px 0 0;padding:0;font-size:12.5px;color:var(--muted)}
.reassure li{padding-left:20px;position:relative;margin-bottom:4px}
.reassure li::before{content:"\2713";position:absolute;left:0;color:var(--money);font-weight:800}

/* ---- ボタン ---- */
.btn{
  appearance:none;border:1px solid transparent;border-radius:12px;
  font:inherit;font-weight:800;font-size:16.5px;cursor:pointer;
  min-height:56px;padding:0 26px;width:100%;
  background:var(--cta);color:var(--cta-fg);box-shadow:var(--shadow-cta);
  transition:background .15s,transform .08s;
}
@media(min-width:560px){ .btn{width:auto} }
.btn:hover{background:var(--cta-hover)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid var(--trust-2);outline-offset:3px}
.btn .arw{margin-left:8px}
.btn.ghost{
  background:transparent;color:var(--muted);border-color:var(--border);
  box-shadow:none;font-weight:600;font-size:14.5px;min-height:48px;padding:0 18px;width:auto;
}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.btn-sub{font-size:12px;color:var(--muted);margin-top:10px}

/* 到達しやすい位置に置く固定CTA（スマホのみ）。QR経由＝ほぼ全員スマホのため */
.sticky{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:blur(8px);border-top:1px solid var(--border);
}
.sticky .btn{width:100%}
@media(min-width:720px){ .sticky{display:none} }

/* ---- 進捗 ---- */
.progress{margin-bottom:22px}
.progress .meta{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);margin-bottom:7px}
.progress .meta b{color:var(--trust);font-weight:800}
.bar{height:8px;background:var(--border);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--trust),var(--trust-2));border-radius:99px;transition:width .45s cubic-bezier(.2,.7,.3,1)}

/* ---- 設問 ---- */
.q-title{font-size:20.5px;font-weight:800;margin:0 0 6px;line-height:1.55;letter-spacing:-.01em}
@media(min-width:720px){ .q-title{font-size:23px} }
.q-note{font-size:13px;color:var(--muted);margin:0 0 18px}
.opts{display:grid;gap:8px}
.opts.grid2{grid-template-columns:1fr}
@media(min-width:600px){ .opts.grid2{grid-template-columns:1fr 1fr} }
.opt{
  display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 16px;
  border:1.5px solid var(--border);border-radius:12px;background:var(--surface);
  cursor:pointer;font-size:15.5px;text-align:left;color:inherit;font-family:inherit;font-weight:600;
  transition:border-color .13s,background .13s,transform .08s;
}
.opt:hover{border-color:var(--trust-2);background:var(--trust-soft)}
.opt:active{transform:scale(.995)}
.opt:focus-visible{outline:3px solid var(--trust-2);outline-offset:2px}
.opt .mark{width:22px;height:22px;flex:none;border:2px solid var(--border);border-radius:50%;display:grid;place-items:center}
.opt.multi .mark{border-radius:7px}
.opt[aria-pressed="true"]{border-color:var(--trust);background:var(--trust-soft)}
.opt[aria-pressed="true"] .mark{border-color:var(--trust);background:var(--trust);color:var(--surface);font-size:13px;font-weight:800}
.opt[aria-pressed="true"] .mark::after{content:"\2713"}

/* ---- 金額入力 ---- */
.money-in{display:flex;align-items:center;gap:10px;border:1.5px solid var(--border);background:var(--surface);border-radius:12px;padding:6px 16px;max-width:440px}
.money-in input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:800 30px/1.5 var(--mono);padding:8px 0;text-align:right}
.money-in input:focus{outline:none}
.money-in .unit{font-size:16px;color:var(--muted);font-weight:700}
.money-in:focus-within{border-color:var(--trust);box-shadow:0 0 0 4px var(--trust-soft)}
.err{color:var(--warn);font-size:13.5px;margin-top:10px;min-height:20px;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:12px}

/* ---- 結果 ---- */
.result-head{font-size:13px;font-weight:800;color:var(--money);letter-spacing:.06em;margin:0 0 8px}
.headline{
  border:2px solid var(--money);background:var(--money-soft);
  border-radius:var(--radius);padding:24px 20px;text-align:center;
}
.headline .lbl{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.headline .big{font:900 46px/1.15 var(--mono);color:var(--money);letter-spacing:-.02em;margin:8px 0}
@media(min-width:640px){ .headline .big{font-size:62px} }
.headline .big small{font-family:inherit;font-size:20px;font-weight:800;margin-left:4px}
.headline .flip{font-size:13.5px;color:var(--muted);margin-top:6px}
.headline .flip b{color:var(--text)}

.subkpis{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:12px}
.kpi{border:1px solid var(--border);border-radius:12px;padding:14px 16px;background:var(--surface-2)}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:700}
.kpi .val{font:800 21px/1.35 var(--mono);margin-top:2px}
.kpi .val small{font-family:inherit;font-size:13px;font-weight:700;margin-left:2px}
.rank{display:inline-flex;align-items:center;gap:8px}
.rank .badge{min-width:30px;height:30px;padding:0 9px;border-radius:8px;display:grid;place-items:center;font:900 14px/1 inherit;color:#fff}
.rank.hi .badge{background:#c2410c} .rank.mid .badge{background:#a8760a} .rank.low .badge{background:var(--money)}
.rank .txt{font-size:13.5px;font-weight:800}

.cols{display:grid;gap:20px;margin-top:24px}
@media(min-width:880px){ .cols{grid-template-columns:1fr 1fr;gap:26px} }
h3.sec{font-size:15px;margin:0 0 13px;font-weight:800;display:flex;align-items:center;gap:8px}
h3.sec::before{content:"";width:3px;height:16px;background:var(--trust);border-radius:2px}

.chart{border:1px solid var(--border);border-radius:12px;padding:18px}
.chart .row{margin-bottom:16px}
.chart .row:last-of-type{margin-bottom:0}
.chart .rl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;font-weight:600}
.chart .rl b{font-family:var(--mono);font-size:15px}
.track{height:28px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.track>span{display:block;height:100%;border-radius:7px;transition:width .7s cubic-bezier(.2,.7,.3,1)}
.track.now>span{background:linear-gradient(90deg,#9aa4b4,#78849a)}
.track.after>span{background:linear-gradient(90deg,var(--money),#3aa87b)}
.chart .cap{font-size:12px;color:var(--muted);margin-top:14px}

ol.acts{list-style:none;margin:0;padding:0;counter-reset:a}
ol.acts li{counter-increment:a;border:1px solid var(--border);border-radius:12px;padding:14px 16px 14px 52px;position:relative;margin-bottom:10px;background:var(--surface-2)}
ol.acts li::before{content:counter(a);position:absolute;left:16px;top:16px;width:24px;height:24px;background:var(--trust);color:var(--surface);border-radius:7px;display:grid;place-items:center;font:800 13px/1 var(--mono)}
ol.acts b{display:block;font-size:14.5px;margin-bottom:3px}
ol.acts p{margin:0;font-size:13px;color:var(--muted);line-height:1.7}

.note{background:var(--trust-soft);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:13.5px;margin-top:16px}

/* ---- 任意フォーム ---- */
.lead{margin-top:18px;border-top:4px solid var(--cta)}
.lead h3.sec::before{background:var(--cta)}
.lead .fields{display:grid;gap:12px}
@media(min-width:640px){ .lead .fields{grid-template-columns:1fr 1fr} }
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field label .req{color:var(--cta);margin-left:4px}
.field label .opt-tag{color:var(--muted);font-weight:600;margin-left:4px;font-size:11.5px}
.field input{width:100%;min-height:50px;border:1.5px solid var(--border);border-radius:10px;background:var(--surface);color:inherit;font:inherit;padding:0 13px}
.field input:focus{outline:none;border-color:var(--trust);box-shadow:0 0 0 4px var(--trust-soft)}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:16px;color:var(--text);cursor:pointer}
.agree input{margin-top:5px;width:19px;height:19px;flex:none;accent-color:var(--trust)}
.agree a{color:var(--trust-2);font-weight:800;text-underline-offset:3px}
.autonomy{font-size:12.5px;color:var(--muted);margin-top:14px;padding-top:12px;border-top:1px dashed var(--border)}

.done{border:2px solid var(--money);background:var(--money-soft);border-radius:12px;padding:20px;text-align:center}
.done .ttl{font-weight:800;font-size:17px;color:var(--money);margin-bottom:6px}

footer.disc{margin-top:26px;font-size:11.5px;color:var(--muted);line-height:1.8}
hr.sep{border:0;border-top:1px solid var(--border);margin:24px 0}
.sitelinks{
  display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:center;
  margin-top:26px;padding-top:18px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);
}
.sitelinks a{color:var(--muted);text-decoration:none;text-underline-offset:3px}
.sitelinks a:hover{color:var(--trust-2);text-decoration:underline}
.sitelinks .operator{font-weight:700}

@media print{
  body{background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  .noprint{display:none !important}
  .card{box-shadow:none;border-color:#bbb}
  .cols{grid-template-columns:1fr 1fr}
  .headline{border-color:#000}
  .track>span{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="site noprint">
    <div class="logo">&#9889;</div>
    <h1 id="siteName">かんたん電気代シミュレーション</h1>
    <span class="sub">無料・登録不要<br>所要時間 約30秒</span>
  </header>

  <main id="app"></main>

  <footer class="disc" id="disclaimer" hidden></footer>

  <nav class="sitelinks noprint">
    <span class="operator">運営：合同会社大和システム</span>
    <a href="./privacy.html">プライバシーポリシー</a>
    <a href="./contact.html">お問い合わせ</a>
  </nav>
</div>

<div id="sticky"></div>

<script>
"use strict";

/* =========================================================================
   0. 運用設定（ここだけ書き換えれば動きます）
   ========================================================================= */

/* サイト名。ここを書き換えると、ヘッダー・ブラウザタブ・送信メールの件名がすべて連動して変わります。
   （SEO用に、HTML冒頭の <title> タグも同じ名前に揃えてください）
   ─ 命名の考え方 ─
     「診断」は医療を連想させ、"判定される" 心理的負担（評価懸念）を生むため使わない。
     「シミュレーション」は主体が利用者側にあり、失敗のない行為として受け取られる。
     漢字だけの名称より、ひらがな始まりのほうが視認・理解の負荷が低く「軽い」と知覚される。 */
var SITE_NAME = "かんたん電気代シミュレーション";

/* Google Apps Script ウェブアプリのURL。
   送信内容はここへPOSTされ、GAS側から通知先メールアドレスへ転送されます。
   通知先アドレスは公開ソースに残さないよう、GAS側（gas-mail.gs の NOTIFY_TO）で管理しています。 */
var SUBMIT_ENDPOINT = "https://script.google.com/macros/s/AKfycbx7UgAvTYaHWKz_QczeaGG5vhfiT2WfKyFWDw7uZVs458pRNusiBDnrSmL6LTn540fJFg/exec";

/* mailto: フォールバック用の通知先アドレス。
   SUBMIT_ENDPOINT が設定されている間は使用されないため、
   迷惑メール対策として意図的に空にしています。
   GASを停止して mailto: 方式に戻す場合のみ、ここにアドレスを記入してください。 */
var NOTIFY_EMAIL = "";

/* 流入経路の記録：QRコードに ?src=... を付けておくと、送信内容に経路が記録されます。
   例）店頭POP → ?src=pop ／ 名刺 → ?src=meishi ／ チラシ → ?src=flyer  */
var SRC = (function(){
  try { return new URLSearchParams(location.search).get("src") || "direct"; }
  catch(e){ return "direct"; }
})();

/* サイト名を画面とタブに反映 */
document.title = SITE_NAME + "｜30秒で削減額がわかる";
document.getElementById("siteName").textContent = SITE_NAME;

/* =========================================================================
   1. 試算ロジック
   -------------------------------------------------------------------------
   削減額は「直近1ヶ月の電気代」の入力値のみから決定する。
   他の設問（業種・エリア・設備・契約数・契約先）は金額計算に一切影響しない。
   ========================================================================= */

/**
 * 最も大きい位で繰り上げる。
 *   12,000 -> 20,000 ／ 6,750 -> 7,000 ／ 52,500 -> 60,000 ／ 1,200 -> 2,000
 * 既に最上位の位で割り切れている場合はそのまま（9,000 -> 9,000）。
 */
function ceilToTopDigit(n){
  if(!isFinite(n) || n <= 0) return 0;
  var digits = Math.floor(Math.log10(n));      // 最上位の位（例: 12000 -> 4）
  var unit = Math.pow(10, digits);             // その位の重み（例: 10000）
  return Math.ceil((n / unit) - 1e-9) * unit;  // 1e-9 は浮動小数点誤差の吸収
}

/** 月間削減額 ＝ ceilToTopDigit(入力金額 × 0.15) */
function monthlySaving(bill){
  return ceilToTopDigit(bill * 0.15);
}

/* ---- 自己テスト（仕様の検算6件） ---- */
(function selfTest(){
  var cases = [[80000,20000],[120000,20000],[45000,7000],[350000,60000],[8000,2000],[60000,9000]];
  var ok = true;
  var rows = cases.map(function(c){
    var got = monthlySaving(c[0]);
    if(got !== c[1]) ok = false;
    return { "入力": c[0], "15%": c[0]*0.15, "期待値": c[1], "実測": got, "判定": got===c[1] ? "OK" : "NG" };
  });
  console.log("%c[自己テスト] ceilToTopDigit / monthlySaving", "font-weight:bold");
  console.table(rows);
  console.log("%c" + (ok ? "全6件 PASS" : "失敗あり"), "color:" + (ok?"green":"red") + ";font-weight:bold");
})();

/* =========================================================================
   2. 設問定義（全7問）
   -------------------------------------------------------------------------
   並び順は「答えやすい順」。最初に負担の軽い設問を置くことで、
   一貫性の原理（小さなYESの積み重ね）により離脱率が下がる。
   最も心理的負担の大きい金額入力は、最後（＝ここまで来たらやめにくい位置）に置く。
   ========================================================================= */
var QUESTIONS = [
  { id:"bizType", type:"single", title:"はじめに、事業形態を教えてください",
    note:"該当するものを選ぶだけです。",
    options:["法人","個人事業主（屋号あり）","わからない"] },

  { id:"industry", type:"single", title:"どのような業種ですか", grid:true,
    options:["飲食店・カフェ","小売・物販","美容室・サロン","クリニック・歯科","事務所・オフィス","工場・作業場","倉庫・物流","宿泊・宿","その他","わからない"] },

  { id:"area", type:"single", title:"事業所はどのエリアにありますか", grid:true,
    options:["北海道","東北","東京","中部","北陸","関西","中国","四国","九州","沖縄","わからない"] },

  { id:"contracts", type:"single", title:"電力の契約は何件ありますか",
    note:"複数の事業所・需給契約がある場合は、その合計件数をお選びください。",
    options:["1件","2〜5件","6〜10件","11件以上","わからない"] },

  { id:"equipment", type:"multi", title:"電気を多く使う設備はどれですか", grid:true,
    note:"当てはまるものをすべてお選びください（複数選択できます）。",

/* =========================================================================
   3. 状態と描画
   ========================================================================= */
var state = { step:-1, answers:{ equipment:[] } };
var app = document.getElementById("app");
var stickyBox = document.getElementById("sticky");

function yen(n){ return Math.round(n).toLocaleString("ja-JP"); }
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
  });
}
function setSticky(html){
  stickyBox.innerHTML = html ? '<div class="sticky noprint">' + html + '</div>' : "";
  document.body.classList.toggle("has-sticky", !!html);
}

/** 全角数字・カンマ・円記号を許容して数値化 */
function parseYen(raw){
  if(raw == null) return NaN;
  var s = String(raw)
    .replace(/[０-９]/g, function(c){ return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
    .replace(/[,，\s円￥¥]/g, "");
  if(s === "" || !/^\d+(\.\d+)?$/.test(s)) return NaN;
  return parseFloat(s);
}

/** 契約数の選択に応じた金額入力の見出し */
function billLabel(){
  var c = state.answers.contracts;
  if(c && c !== "1件" && c !== "わからない") return "全" + c + "分を合わせて、直近1ヶ月の電気代はいくらでしたか";
  return "直近1ヶ月の電気代はいくらでしたか";
}

function render(){
  if(state.step === -1) return renderIntro();
  if(state.step < QUESTIONS.length) return renderQuestion(QUESTIONS[state.step]);
  return renderResult();
}

/* ---- 設問 --------------------------------------------------------------
   ・進捗バーは15%から開始（授かり進捗効果：既に始まっている課題は完了させたくなる）
   ・「あと◯問」を明示（目標勾配効果：残りが少ないほど加速する）
   ------------------------------------------------------------------------ */
function renderQuestion(q){
  document.getElementById("disclaimer").hidden = true;
  setSticky("");

  var total = QUESTIONS.length;
  var pct = Math.round(15 + 85 * (state.step / total));   // 15%スタート
  var left = total - state.step;
  var body = "";

  if(q.type === "single" || q.type === "multi"){
    var sel = state.answers[q.id];
    body =
      '<div class="opts ' + (q.grid ? "grid2" : "") + '" role="group">' +
      q.options.map(function(o){
        var on = q.type === "multi" ? (sel || []).indexOf(o) >= 0 : sel === o;
        return '<button type="button" class="opt ' + (q.type === "multi" ? "multi" : "") + '" ' +
               'aria-pressed="' + on + '" data-v="' + esc(o) + '">' +
               '<span class="mark" aria-hidden="true"></span><span>' + esc(o) + '</span></button>';
      }).join("") +
      '</div>';
  } else {
    var cur = state.answers.bill != null ? state.answers.bill : "";
    body =
      '<div class="money-in"><input type="text" inputmode="numeric" id="bill" ' +
        'placeholder="0" value="' + esc(cur) + '" aria-label="直近1ヶ月の電気代"><span class="unit">円 / 月</span></div>' +
      '<div class="err" id="billErr" role="alert"></div>' +
      '<p class="hint">1円単位まで正確でなくて構いません。おおよその金額で試算できます。</p>';
  }

  app.innerHTML =
    '<section class="card pad fade">' +
      '<div class="progress noprint">' +
        '<div class="meta"><span>質問 ' + (state.step + 1) + ' / ' + total + '</span>' +
        '<span>' + (left === 1 ? '<b>これが最後の質問です</b>' : 'あと <b>' + left + '問</b>') + '</span></div>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
      '</div>' +
      '<h2 class="q-title">' + esc(q.type === "number" ? billLabel() : q.title) + '</h2>' +
      '<p class="q-note">' + esc(q.note ? q.note : (q.type === "multi" ? "当てはまるものをすべてお選びください。" : "当てはまるものを1つお選びください。")) + '</p>' +
      body +
      '<div class="btnrow">' +
        (q.type !== "single" ? '<button class="btn" id="next">' + (q.type === "number" ? "結果を見る" : "次へ進む") + '<span class="arw">&rarr;</span></button>' : '') +
        (state.step > 0 ? '<button class="btn ghost" id="back">&larr; 戻る</button>' : '') +
      '</div>' +
    '</section>';

  var back = document.getElementById("back");
  if(back) back.onclick = function(){ state.step--; render(); };

  if(q.type === "single"){
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(el){
      el.onclick = function(){
        state.answers[q.id] = el.dataset.v;
        state.step++;
        render();
      };
    });
  }

  if(q.type === "multi"){
    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function(el){
      el.onclick = function(){
        var v = el.dataset.v;
        var sel = state.answers[q.id] || [];
        var isEx = (q.exclusive || []).indexOf(v) >= 0;
        if(sel.indexOf(v) >= 0){
          sel = sel.filter(function(x){ return x !== v; });
        } else if(isEx){
          sel = [v];
        } else {
          sel = sel.filter(function(x){ return (q.exclusive || []).indexOf(x) < 0; }).concat([v]);
        }
        state.answers[q.id] = sel;
        render();
      };
    });
    document.getElementById("next").onclick = function(){
      if(!(state.answers[q.id] || []).length) state.answers[q.id] = ["わからない"];
      state.step++;
      render();
    };
  }

  if(q.type === "number"){
    var input = document.getElementById("bill");
    var err = document.getElementById("billErr");
    var go = function(){
      var v = parseYen(input.value);
      if(isNaN(v)){ err.textContent = "半角数字でご入力ください。"; input.focus(); return; }
      if(v < 1000){ err.textContent = "1,000円以上の金額をご入力ください。"; input.focus(); return; }
      if(v > 10000000){ err.textContent = "1,000万円を超えています。桁をご確認ください。"; input.focus(); return; }
      state.answers.bill = v;
      state.step++;
      render();
    };
    document.getElementById("next").onclick = go;
    input.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); go(); } });
    input.addEventListener("input", function(){ err.textContent = ""; });
    input.focus();
  }
}

/* ---- 施策の組み立て（最大3件） ---- */
function buildActions(a){
  var out = [];
  function push(o){
    if(!o) return;
    for(var i = 0; i < out.length; i++){ if(out[i].t === o.t) return; }
    out.push(o);
  }
  push(ACT_PROVIDER[a.provider] || ACT_PROVIDER["わからない"]);
  if(a.contracts && a.contracts !== "1件" && a.contracts !== "わからない") push(ACT_MULTI);
  (a.equipment || []).forEach(function(e){ push(ACT_EQUIP[e]); });
  push(ACT_INDUSTRY[a.industry] || ACT_INDUSTRY["その他"]);
  return out.slice(0, 3);
}

    window.scrollTo(0, 0);
  };
  document.getElementById("print").onclick = function(){ window.print(); };

  var form = document.getElementById("leadForm");
  if(form) form.onsubmit = submitLead;
  var pl = document.getElementById("policyLink");
  if(pl) pl.addEventListener("click", function(e){ e.stopPropagation(); });

  var d = document.getElementById("disclaimer");
  d.hidden = false;
  d.innerHTML = '<hr class="sep">本シミュレーションは、ご入力いただいた直近1ヶ月の電気料金をもとにした簡易試算であり、実際の削減額をお約束するものではありません。' +
    '実際の料金・削減効果は契約プラン、契約電力、使用状況、燃料費調整額、再生可能エネルギー発電促進賦課金等により変動します。' +
    '正確な金額は検針票および各電力会社・小売電気事業者の公式情報をご確認ください。' +
    '本シミュレーションは電力契約の勧誘・媒介を目的とするものではありません。';

  window.scrollTo(0, 0);
}

/* =========================================================================
   4. 問い合わせの送信
   -------------------------------------------------------------------------
   SUBMIT_ENDPOINT（Google Apps Script）が設定されていれば自動でメール送信。
   未設定の場合は mailto: で送信者のメールソフトを起動する方式に切り替わる。
   ========================================================================= */
function buildPayload(){
  var a = state.answers, r = state.result || {};
  var v = function(id){ var el = document.getElementById(id); return el ? el.value.trim() : ""; };
  return {
    "サイト名": SITE_NAME,
    "送信日時": new Date().toLocaleString("ja-JP"),
    "流入経路": SRC,
    "メールアドレス": v("f3"),
    "会社名／屋号": v("f1") || "（未入力）",
    "ご担当者名": v("f2") || "（未入力）",
    "電話番号": v("f4") || "（未入力）",
    "――― 入力内容 ―――": "",
    "事業形態": a.bizType || "",
    "業種": a.industry || "",
    "エリア": a.area || "",
    "契約数": a.contracts || "",
    "主な設備": (a.equipment || []).join("・"),
    "現在の契約先": a.provider || "",
    "直近1ヶ月の電気代": yen(a.bill) + " 円",
    "想定 月間削減額": yen(r.save) + " 円",
    "想定 年間削減額": yen(r.saveY) + " 円",
    "見直しの優先度": r.rank || "",
    "ページURL": location.href
  };
}

function submitLead(e){
  e.preventDefault();
  var msg = document.getElementById("leadMsg");
  var email = document.getElementById("f3").value.trim();

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    msg.style.color = "var(--warn)";
    msg.textContent = "メールアドレスの形式をご確認ください。";
    document.getElementById("f3").focus();
    return;
  }
  if(!document.getElementById("agree").checked){
    msg.style.color = "var(--warn)";
    msg.textContent = "プライバシーポリシーへの同意にチェックをお願いします。";
    return;
  }

  var payload = buildPayload();
  var btn = document.querySelector("#leadForm button[type=submit]");
  btn.disabled = true;
  btn.textContent = "送信中...";

  if(SUBMIT_ENDPOINT){
    /* Google Apps Script はブラウザ側でレスポンスを読めないため no-cors で送信する */
    fetch(SUBMIT_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(showDone).catch(function(){
      btn.disabled = false;
      btn.textContent = "無料で正確な試算を依頼する";
      msg.style.color = "var(--warn)";
      msg.textContent = "送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。";
    });
  } else {
    /* フォールバック：送信者のメールソフトを起動する */
    var body = Object.keys(payload).map(function(k){
      return payload[k] === "" && k.indexOf("―") === 0 ? "\n" + k + "\n" : k + "： " + payload[k];
    }).join("\n");
    var href = "mailto:" + NOTIFY_EMAIL +
      "?subject=" + encodeURIComponent("【" + SITE_NAME + "】試算のご依頼") +
      "&body=" + encodeURIComponent(body);
    location.href = href;
    setTimeout(showDone, 600);
  }

  function showDone(){
    document.getElementById("leadSec").innerHTML =
      '<div class="done">' +
        '<div class="ttl">送信が完了しました</div>' +
        '<p style="margin:0;font-size:14px">ありがとうございます。担当者より、原則1営業日以内にご連絡いたします。<br>' +
        'この画面は「結果を印刷／PDF保存」から保存しておけます。</p>' +
      '</div>';
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }
}

render();
</script>
