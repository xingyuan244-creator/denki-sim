<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>お問い合わせ｜かんたん電気代シミュレーション</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f2f5f9;
  --border:#e0e5ec; --text:#101828; --muted:#5b6779;
  --trust:#123a6b; --trust-2:#2f6fd0; --trust-soft:#e9f0fa;
  --cta:#d9530a; --cta-fg:#ffffff; --cta-hover:#bd4607;
  --money:#0b7a52; --money-soft:#e6f5ee; --warn:#b4231f;
  --shadow:0 1px 2px rgba(16,32,56,.05), 0 10px 28px rgba(16,32,56,.07);
  --shadow-cta:0 4px 14px rgba(217,83,10,.28);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c1017; --surface:#151b24; --surface-2:#1b232e;
    --border:#2a3441; --text:#e8eef6; --muted:#98a5b7;
    --trust:#7fb0f0; --trust-2:#9cc4fa; --trust-soft:#152437;
    --cta:#ff8a3d; --cta-fg:#2a1403; --cta-hover:#ffa163;
    --money:#4bc48d; --money-soft:#12291f; --warn:#ff8b86;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.4);
    --shadow-cta:0 4px 14px rgba(255,138,61,.22);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text); line-height:1.8;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 64px}
header.site{display:flex;align-items:center;gap:10px;padding:2px 0 18px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--trust);display:grid;place-items:center;color:#fff;font-size:16px}
@media (prefers-color-scheme: dark){ .logo{color:#0c1017} }
header.site h1{font-size:14.5px;margin:0;font-weight:700}
.back{margin-left:auto;font-size:12.5px;color:var(--trust-2);text-decoration:none;font-weight:700}
.back:hover{text-decoration:underline}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 22px}
@media(min-width:720px){ .card{padding:38px 42px} }

h2.doc{font-size:22px;margin:0 0 8px;letter-spacing:-.01em}
.lead-p{color:var(--muted);font-size:14px;margin:0 0 26px}

.fields{display:grid;gap:14px}
@media(min-width:600px){ .fields.two{grid-template-columns:1fr 1fr} }
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.field label .req{color:var(--cta);margin-left:5px}
.field label .opt-tag{color:var(--muted);font-weight:600;margin-left:5px;font-size:11.5px}
.field input,.field textarea{
  width:100%;border:1.5px solid var(--border);border-radius:10px;
  background:var(--surface-2);color:inherit;font:inherit;padding:11px 13px;
}
.field input{min-height:50px}
.field textarea{min-height:150px;resize:vertical;line-height:1.8}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--trust);box-shadow:0 0 0 4px var(--trust-soft)}

.agree{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:20px;cursor:pointer}
.agree input{margin-top:5px;width:19px;height:19px;flex:none;accent-color:var(--trust)}
.agree a{color:var(--trust-2);font-weight:800;text-underline-offset:3px}

.btn{
  appearance:none;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:16.5px;
  cursor:pointer;min-height:56px;padding:0 26px;width:100%;margin-top:20px;
  background:var(--cta);color:var(--cta-fg);box-shadow:var(--shadow-cta);
  transition:background .15s,transform .08s;
}
@media(min-width:560px){ .btn{width:auto} }
.btn:hover{background:var(--cta-hover)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.err{color:var(--warn);font-size:13.5px;margin-top:12px;min-height:20px;font-weight:600}
.note{font-size:12.5px;color:var(--muted);margin-top:18px;padding-top:14px;border-top:1px dashed var(--border)}
.done{border:2px solid var(--money);background:var(--money-soft);border-radius:12px;padding:26px 20px;text-align:center}
.done .ttl{font-weight:800;font-size:18px;color:var(--money);margin-bottom:8px}
footer.foot{margin-top:26px;font-size:12px;color:var(--muted);text-align:center}
footer.foot a{color:var(--trust-2)}
</style>
</head>
<body>
<div class="wrap">

  <header class="site">
    <div class="logo">&#9889;</div>
    <h1>かんたん電気代シミュレーション</h1>
    <a class="back" href="./">&larr; シミュレーションに戻る</a>
  </header>

  <main class="card" id="main">
    <h2 class="doc">お問い合わせ</h2>
    <p class="lead-p">
      サービスに関するご質問、個人情報の開示・訂正・利用停止のご請求、
      運営会社の住所および代表者氏名のご請求は、こちらのフォームよりお寄せください。
    </p>

    <form id="form" novalidate>
      <div class="fields two">
        <div class="field">
          <label for="name">お名前<span class="opt-tag">任意</span></label>
          <input type="text" id="name" autocomplete="name">
        </div>
        <div class="field">
          <label for="company">会社名 / 屋号<span class="opt-tag">任意</span></label>
          <input type="text" id="company" autocomplete="organization">
        </div>
      </div>
      <div class="fields" style="margin-top:14px">
        <div class="field">
          <label for="email">メールアドレス<span class="req">必須</span></label>
          <input type="email" id="email" autocomplete="email" placeholder="example@company.co.jp">
        </div>
        <div class="field">
          <label for="body">お問い合わせ内容<span class="req">必須</span></label>
          <textarea id="body" placeholder="ご用件をご記入ください。"></textarea>
        </div>
      </div>

      <label class="agree">
        <input type="checkbox" id="agree">
        <span><a href="./privacy.html" id="policyLink" target="_blank" rel="noopener">プライバシーポリシー</a>に同意して送信します</span>
      </label>

      <button class="btn" type="submit" id="send">送信する</button>
      <div class="err" id="msg" role="status"></div>

      <p class="note">
        ご入力内容を他社に提供することはありません。ご返信は、原則1営業日以内に差し上げます。
      </p>
    </form>
  </main>

  <footer class="foot">
    運営：合同会社大和システム ｜ <a href="./privacy.html">プライバシーポリシー</a>
  </footer>
</div>

<script>
"use strict";

/* 送信先は index.html と同じ Google Apps Script ウェブアプリ */
var SUBMIT_ENDPOINT = "https://script.google.com/macros/s/AKfycbx7UgAvTYaHWKz_QczeaGG5vhfiT2WfKyFWDw7uZVs458pRNusiBDnrSmL6LTn540fJFg/exec";

var $ = function(id){ return document.getElementById(id); };

/* ラベル内のリンクを押したときにチェックが切り替わらないようにする */
$("policyLink").addEventListener("click", function(e){ e.stopPropagation(); });

$("form").onsubmit = function(e){
  e.preventDefault();
  var msg = $("msg");
  var email = $("email").value.trim();
  var body  = $("body").value.trim();

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    msg.textContent = "メールアドレスの形式をご確認ください。"; $("email").focus(); return;
  }
  if(body.length < 5){
    msg.textContent = "お問い合わせ内容をご記入ください。"; $("body").focus(); return;
  }
  if(!$("agree").checked){
    msg.textContent = "プライバシーポリシーへの同意にチェックをお願いします。"; return;
  }

  var payload = {
    /* GAS側は「サイト名」を件名に使うため、シミュレーションの送信と区別できる値にする */
    "サイト名": "かんたん電気代シミュレーション／お問い合わせ",
    "送信日時": new Date().toLocaleString("ja-JP"),
    "会社名／屋号": $("company").value.trim() || $("name").value.trim() || "（未入力）",
    "お名前": $("name").value.trim() || "（未入力）",
    "メールアドレス": email,
    "――― お問い合わせ内容 ―――": "",
    "本文": body,
    "ページURL": location.href
  };

  var btn = $("send");
  btn.disabled = true; btn.textContent = "送信中...";

  fetch(SUBMIT_ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).then(function(){
    $("main").innerHTML =
      '<div class="done">' +
        '<div class="ttl">送信が完了しました</div>' +
        '<p style="margin:0;font-size:14px">お問い合わせありがとうございます。<br>' +
        '原則1営業日以内に、ご記入いただいたメールアドレス宛にご返信いたします。</p>' +
        '<p style="margin:16px 0 0"><a href="./">&larr; シミュレーションに戻る</a></p>' +
      '</div>';
    window.scrollTo(0,0);
  }).catch(function(){
    btn.disabled = false; btn.textContent = "送信する";
    msg.textContent = "送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。";
  });
};
</script>
</body>
</html>
